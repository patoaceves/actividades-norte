<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservar - Actividades Norte</title>
  <meta name="description" content="Consulta disponibilidad y solicita tu reservación en Los Pinos.">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/png/isotipo.png">
  <link rel="shortcut icon" href="/assets/png/isotipo.png">
  <link rel="apple-touch-icon" href="/assets/png/isotipo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/site.css">
  <style>
    :root{ --cream:#F6F1E7; --green:#2A4030; --gold:#A07840; --muted:#6B7066; }
    .rsv-wrap{max-width:960px;margin:0 auto;padding:clamp(24px,5vw,64px) var(--gutter,24px)}
    .rsv-eyebrow{font-family:'JetBrains Mono',monospace;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
    .rsv-wrap h1{font-family:'Playfair Display',serif;font-weight:500;font-size:clamp(1.9rem,4.5vw,2.6rem);color:var(--green);margin-bottom:6px;letter-spacing:-.01em}
    .rsv-loc{display:flex;align-items:center;gap:6px;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:.74rem;letter-spacing:.04em;margin-bottom:20px}
    .rsv-hero{width:100%;height:clamp(200px,34vw,340px);object-fit:cover;border-radius:14px;margin-bottom:22px}
    .rsv-desc{font-family:'Lora',serif;font-size:1.02rem;line-height:1.7;color:#2f342b;max-width:70ch;margin-bottom:24px}
    .rsv-amen{border-top:1px solid rgba(42,64,48,.14);padding-top:20px;margin-bottom:28px}
    .rsv-amen-title{font-family:'JetBrains Mono',monospace;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
    .rsv-amen-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
    @media(max-width:520px){.rsv-amen-grid{grid-template-columns:repeat(2,1fr)}}
    .rsv-amen-cell{background:#fff;border:1px solid rgba(42,64,48,.12);border-radius:8px;padding:12px 10px;text-align:center}
    .rsv-amen-cell .n{display:block;font-family:'Playfair Display',serif;font-size:1.35rem;color:var(--green);line-height:1}
    .rsv-amen-cell .l{display:block;font-size:.7rem;color:var(--muted);margin-top:5px}
    .rsv-amen-lists{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    @media(max-width:520px){.rsv-amen-lists{grid-template-columns:1fr}}
    .rsv-amen-lists h4{font-size:.8rem;color:var(--green);margin:0 0 6px}
    .rsv-amen-lists ul{margin:0;padding-left:1rem;font-family:'Lora',serif;font-size:.9rem;color:#2f342b;line-height:1.6}
    .rsv-cta{display:inline-flex;align-items:center;gap:9px;font-family:'Lora',serif;font-size:1.05rem;padding:14px 26px;background:var(--green);color:var(--cream);border:none;border-radius:100px;cursor:pointer;text-decoration:none}
    .rsv-cta:hover{background:#1f3123}
  </style>
  <script defer src="/assets/js/reveal.js"></script>
  <script defer src="/assets/js/mobile-nav.js"></script>
</head>
<body>
  <nav class="nav" id="nav">
    <a href="/" class="nav-logo">
      <span class="nav-logo-img-wrap">
        <img class="nav-logo-img-light" src="/assets/png/isotipo.png" alt="">
        <img class="nav-logo-img-dark" src="/assets/png/isotipo-dark.png" alt="">
      </span>
      <span>Actividades Norte</span>
    </a>
    <div class="nav-links">
      <a href="/varonil">Varonil</a>
      <a href="/femenil">Femenil</a>
      <a href="/#casas">Casas</a>
      <a href="/contacto">Contacto</a>
    </div>
    <a href="/" class="nav-cta">
      <svg width="14" height="10" viewBox="0 0 18 12" fill="none"><path d="M17 6H2m0 0l5-5M2 6l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>Inicio</span>
    </a>
    <button class="nav-menu-btn" aria-label="Menú"><span></span><span></span><span></span></button>
  </nav>

  <main class="rsv-wrap">
    <div class="rsv-eyebrow">Reservación</div>
    <h1 id="casaNombre">Casa</h1>
    <div class="rsv-loc">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 1 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <span>Sierra de Arteaga, Coahuila</span>
    </div>
    <img class="rsv-hero" id="casaHero" src="" alt="">
    <p class="rsv-desc" id="casaDesc"></p>
    <div id="casaAmen"></div>
    <a class="rsv-cta" id="btnConsultar" href="#">
      Consultar disponibilidad
      <svg width="16" height="11" viewBox="0 0 18 12" fill="none"><path d="M1 6h15m0 0l-5-5m5 5l-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </a>
  </main>

  <script>
  (function(){
    var DESC = "En 1960, Rosario Garza de Zambrano donó su casa de verano, Los Pinos, en Sierra de Arteaga, Coahuila, para transformarla en un centro de formación. Desde el año 2000 también hospeda El Pinar, Escuela Técnica en Servicios de Hospitalidad, dedicada a la formación de mujeres de áreas rurales.";
    var AREAS = ["Campo de fútbol","Cancha de tennis","Cancha de padel","Cancha de basquetbol","Lago"];
    var CASAS = {
      "casa-grande": { nombre:"Casa Grande", img:"/assets/png/casa-grande/casa-grande-hero.png",
        amen:{"Huéspedes":24,"Habitaciones":22,"Baños":21,"Estacionamiento":"20 coches","Oratorio":1,"Aulas":1},
        zonas:["Biblioteca","Sala de TV","Comedor"], areas:AREAS },
      "casa-del-bosque-i": { nombre:"Casa del Bosque I", img:"/assets/png/casa-del-bosque-i/casa-del-bosque-i-hero.jpg",
        amen:{"Huéspedes":20,"Habitaciones":20,"Baños":20,"Estacionamiento":"20 coches","Oratorio":1,"Aulas":2},
        zonas:["Biblioteca","Sala de TV","Mediateca","Salón de conferencias","7 salas de entrevistas","Comedor"], areas:AREAS },
      "casa-del-bosque-ii": { nombre:"Casa del Bosque II", img:"/assets/png/casa-del-bosque-ii/casa-del-bosque-ii-hero.jpg",
        amen:{"Huéspedes":20,"Habitaciones":20,"Baños":20,"Estacionamiento":"20 coches","Oratorio":1,"Aulas":2},
        zonas:["Biblioteca","Sala de TV","Mediateca","Salón de conferencias","7 salas de entrevistas","Comedor"], areas:AREAS },
    };
    function esc(s){return String(s).replace(/[&<>]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[m];});}
    function qs(id){return document.getElementById(id);}
    var params = new URLSearchParams(location.search);
    var casaKey = params.get('casa') || 'casa-grande';
    if(!CASAS[casaKey]) casaKey='casa-grande';
    var casa = CASAS[casaKey];
    qs('casaNombre').textContent = casa.nombre;
    qs('casaHero').src = casa.img; qs('casaHero').alt = casa.nombre;
    qs('casaDesc').textContent = DESC;
    var cells=''; for(var k in casa.amen){ cells+='<div class="rsv-amen-cell"><span class="n">'+esc(casa.amen[k])+'</span><span class="l">'+esc(k)+'</span></div>'; }
    var lists='<div><h4>Zonas comunes</h4><ul>'+casa.zonas.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>'
             +'<div><h4>Áreas recreativas</h4><ul>'+casa.areas.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>';
    qs('casaAmen').innerHTML='<div class="rsv-amen"><div class="rsv-amen-title">Amenidades</div><div class="rsv-amen-grid">'+cells+'</div><div class="rsv-amen-lists">'+lists+'</div></div>';
    qs('btnConsultar').href = '/reservar/seccion?casa=' + encodeURIComponent(casaKey);
  })();
  </script>
</body>
</html>
